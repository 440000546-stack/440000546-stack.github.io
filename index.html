<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>母亲节快乐</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft YaHei", sans-serif;
      background: #ffe4ec;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
    }
    .petal {
      position: absolute;
      font-size: 24px;
      animation: fall linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      from { transform: translateY(-100px) rotate(0deg); }
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
    .envelope {
      width: 500px;
      height: 320px;
      background: #f8b6c8;
      border-radius: 30px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    button {
      padding: 16px 32px;
      border: none;
      border-radius: 50px;
      background: #ff4f87;
      color: white;
      font-size: 22px;
      cursor: pointer;
      z-index: 20;
    }
    .letter {
      position: absolute;
      width: 420px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      top: 60px;
      opacity: 0;
      transition: all 1s;
      text-align: center;
      line-height: 1.8;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .open .letter {
      top: -260px;
      opacity: 1;
    }
    .rose {
      position: absolute;
      font-size: 70px;
    }
    .left { left: 80px; bottom: 60px; }
    .right { right: 80px; bottom: 60px; }
  </style>
</head>
<body>
  <div class="rose left">🌹🌹🌹</div>
  <div class="rose right">🌹🌹🌹</div>

  <div class="envelope" id="envelope">
    <button onclick="toggleLetter()">点击打开 💌</button>
    <div class="letter">
      <h1 style="color:#ff4f87">母亲节快乐 ❤️</h1>
      <p>
        妈妈，感谢您一直以来的爱与付出。<br>
        您是我最温暖的依靠，也是我最敬爱的人。<br><br>
        今晚让我为您做一顿晚饭，<br>
        希望能用这一点点心意让你开心！🍽️💕<br><br>
        愿您永远开心、健康、美丽！
      </p>
    </div>
  </div>

  <script>
    function toggleLetter(){
      document.getElementById('envelope').classList.toggle('open');
    }

    for(let i=0;i<20;i++){
      const p=document.createElement('div');
      p.className='petal';
      p.innerHTML='🌸';
      p.style.left=Math.random()*100+'vw';
      p.style.animationDuration=(5+Math.random()*5)+'s';
      p.style.animationDelay=Math.random()*5+'s';
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
