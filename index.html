<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prom Invitation</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 20% 20%, #ffd6e8, transparent 26%),
                  radial-gradient(circle at 80% 80%, #ffc8dd, transparent 28%),
                  radial-gradient(circle at center, rgba(255,255,255,0.16), transparent 35%),
                  linear-gradient(135deg, #16002e, #4b1d75, #7597de);
      color: white;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.65) 1px, transparent 1px);
      background-size: 38px 38px;
      opacity: 0.16;
      animation: sparkleBg 7s linear infinite;
    }

    @keyframes sparkleBg {
      from { transform: translateY(0); }
      to { transform: translateY(-38px); }
    }

    .glow {
      position: absolute;
      width: 580px;
      height: 580px;
      border-radius: 50%;
      background: rgba(255, 96, 180, 0.3);
      filter: blur(95px);
      animation: glowMove 9s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes glowMove {
      from { transform: translate(-180px, -130px); }
      to { transform: translate(190px, 125px); }
    }

    .scene {
      width: 92%;
      max-width: 760px;
      min-height: 650px;
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .envelope-area {
      position: relative;
      width: 560px;
      height: 440px;
      animation: float 3s ease-in-out infinite alternate;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%) translateY(150px) scale(0.78);
      width: 455px;
      min-height: 340px;
      padding: 38px 34px;
      background: linear-gradient(180deg, #fffafd, #ffeef6);
      color: #4b244a;
      border-radius: 25px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.28);
      opacity: 0;
      z-index: 2;
      overflow: hidden;
      animation: pullLetter 2.2s cubic-bezier(.16,.84,.33,1) forwards;
      animation-delay: 1.15s;
    }

    .letter::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px dashed rgba(255, 79, 154, 0.28);
      border-radius: 20px;
      pointer-events: none;
    }

    .letter::after {
      content: "♡";
      position: absolute;
      right: 22px;
      bottom: 12px;
      font-size: 55px;
      color: rgba(255, 79, 154, 0.16);
    }

    @keyframes pullLetter {
      0% {
        transform: translateX(-50%) translateY(150px) scale(0.78) rotate(-1deg);
        opacity: 0;
        filter: blur(3px);
      }
      45% {
        transform: translateX(-50%) translateY(-25px) scale(0.92) rotate(1deg);
        opacity: 1;
        filter: blur(0);
      }
      100% {
        transform: translateX(-50%) translateY(-50px) scale(1) rotate(0deg);
        opacity: 1;
        filter: blur(0);
      }
    }

    .letter-content {
      opacity: 0;
      transform: translateY(18px);
      animation: textAppear 1.2s ease forwards;
      animation-delay: 3s;
      position: relative;
      z-index: 3;
    }

    @keyframes textAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .to-text {
      font-family: 'Great Vibes', cursive;
      font-size: 56px;
      color: #ff4f9a;
      margin-bottom: 16px;
      text-shadow: 0 0 16px rgba(255, 79, 154, 0.25);
    }

    .letter p {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 17px;
    }

    .question {
      font-size: 30px;
      font-weight: 700;
      color: #ff4f9a;
      margin: 18px 0 22px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 31px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff4f9a, #ff85b3);
      color: white;
      box-shadow: 0 10px 24px rgba(255, 79, 154, 0.46);
    }

    #yesBtn:hover {
      transform: scale(1.12) rotate(-2deg);
    }

    #noBtn {
      background: white;
      color: #ff4f9a;
      border: 2px solid #ff8fbd;
    }

    #noBtn:hover {
      transform: scale(0.95);
    }

    .message {
      margin-top: 18px;
      min-height: 32px;
      font-size: 21px;
      font-weight: 700;
      color: #ff4f9a;
    }

    .envelope {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 560px;
      height: 320px;
      z-index: 4;
      animation: envelopeDisappear 1.25s ease forwards;
      animation-delay: 3.15s;
    }

    @keyframes envelopeDisappear {
      to {
        opacity: 0;
        transform: translateX(-50%) translateY(80px) scale(0.92);
        filter: blur(8px);
        pointer-events: none;
      }
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ff9bc8, #ff5fa2);
      border-radius: 24px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.37);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 280px solid transparent;
      border-right: 280px solid transparent;
      border-top: 168px solid #ffc0d9;
      transform-origin: top center;
      animation: openFlap 1.1s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay: 0.35s;
      z-index: 5;
    }

    @keyframes openFlap {
      to { transform: rotateX(180deg); }
    }

    .front-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-bottom: 320px solid #ff6aa8;
      border-right: 280px solid transparent;
      border-radius: 0 0 0 24px;
      z-index: 6;
    }

    .front-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-bottom: 320px solid #ff4f9a;
      border-left: 280px solid transparent;
      border-radius: 0 0 24px 0;
      z-index: 6;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 145px;
      transform: translateX(-50%);
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: white;
      color: #ff4f9a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      z-index: 7;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      animation: sealPop 0.65s ease forwards;
      animation-delay: 0.65s;
    }

    @keyframes sealPop {
      to {
        opacity: 0;
        transform: translateX(-50%) scale(0) rotate(180deg);
      }
    }

    .see-you {
      display: none;
      position: absolute;
      inset: 0;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: radial-gradient(circle at center, rgba(150, 0, 40, 0.28), transparent 45%),
                  rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(13px);
      border-radius: 35px;
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 30px 80px rgba(0,0,0,0.68);
      z-index: 10;
      padding: 35px;
      animation: finalShow 0.9s ease forwards;
    }

    @keyframes finalShow {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .rose-vase-img {
      width: 290px;
      max-width: 80%;
      height: 260px;
      object-fit: cover;
      object-position: center;
      border-radius: 26px;
      box-shadow: 0 28px 70px rgba(0,0,0,0.75);
      border: 2px solid rgba(255,255,255,0.4);
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(70px) scale(0.82);
      animation: vaseRise 1.4s ease forwards;
      animation-delay: 0.2s;
    }

    @keyframes vaseRise {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .spotlight {
      position: absolute;
      width: 390px;
      height: 390px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 95, 150, 0.35), transparent 65%);
      filter: blur(12px);
      z-index: -1;
      animation: softPulse 2.5s ease-in-out infinite alternate;
    }

    @keyframes softPulse {
      from { opacity: 0.55; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1.05); }
    }

    .see-you h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 78px;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(0,0,0,0.8), 0 0 28px rgba(255,110,170,0.65);
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(18px);
      animation: finalText 1s ease forwards;
      animation-delay: 0.85s;
    }

    .see-you p {
      font-size: 26px;
      font-weight: 700;
      color: #ffd6e8;
      text-shadow: 0 0 15px rgba(0,0,0,0.75);
      opacity: 0;
      transform: translateY(18px);
      animation: finalText 1s ease forwards;
      animation-delay: 1.1s;
    }

    @keyframes finalText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 650px) {
      .scene { min-height: 650px; }
      .envelope-area {
        width: 340px;
        height: 430px;
      }

      .envelope {
        width: 340px;
        height: 220px;
      }

      .flap {
        border-left-width: 170px;
        border-right-width: 170px;
        border-top-width: 112px;
      }

      .front-left {
        border-bottom-width: 220px;
        border-right-width: 170px;
      }

      .front-right {
        border-bottom-width: 220px;
        border-left-width: 170px;
      }

      .letter {
        width: 310px;
        padding: 30px 20px;
      }

      @keyframes pullLetter {
        0% { transform: translateX(-50%) translateY(125px) scale(0.78); opacity: 0; filter: blur(3px); }
        45% { transform: translateX(-50%) translateY(-25px) scale(0.92); opacity: 1; filter: blur(0); }
        100% { transform: translateX(-50%) translateY(-50px) scale(1); opacity: 1; filter: blur(0); }
      }

      .to-text { font-size: 43px; }
      .question { font-size: 23px; }
      .letter p { font-size: 15.5px; }
      .rose-vase-img { width: 240px; height: 220px; }
      .see-you h2 { font-size: 55px; }
      .see-you p { font-size: 21px; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <div class="scene">
    <div class="envelope-area">
      <div class="letter" id="letter">
        <div class="letter-content">
          <div class="to-text">To my baby Joanna</div>
          <p>I made this little letter because I wanted to ask you in a cute way.</p>
          <p>Prom would be so much better with you beside me.</p>

          <div class="question">Will you come to prom with me?</div>

          <div class="buttons">
            <button id="yesBtn">Yes 💖</button>
            <button id="noBtn">No</button>
          </div>

          <div class="message" id="message"></div>
        </div>
      </div>

      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="flap"></div>
        <div class="front-left"></div>
        <div class="front-right"></div>
        <div class="seal">♡</div>
      </div>
    </div>

    <div class="see-you" id="seeYou">
      <div class="spotlight"></div>
      <img class="rose-vase-img" src="https://images.unsplash.com/photo-1596438459194-f275f413d6ff?auto=format&fit=crop&w=900&q=80" alt="vase of red roses" />
      <h2>See you at prom</h2>
      <p>my babyyyyyyy 💖</p>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");
    const seeYou = document.getElementById("seeYou");

    let noCount = 0;

    yesBtn.addEventListener("click", function () {
      seeYou.style.display = "flex";
    });

    noBtn.addEventListener("click", function () {
      noCount++;

      if (noCount === 1) {
        message.textContent = "Are you sure? 😭";
      } else if (noCount === 2) {
        message.textContent = "Try one more time...";
      } else {
        noBtn.style.opacity = "0";
        noBtn.style.transform = "scale(0.4) rotate(20deg)";
        setTimeout(() => {
          noBtn.style.display = "none";
        }, 250);
        message.textContent = "The no button disappeared 😄";
      }
    });
  </script>
</body>
</html>
