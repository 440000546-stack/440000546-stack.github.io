<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>母亲节快乐</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:"Microsoft YaHei",sans-serif;
  background:#ffe4ec;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* 花瓣 */
.petal{
  position:absolute;
  font-size:22px;
  animation:fall linear infinite;
  pointer-events:none;
}

@keyframes fall{
  0%{transform:translateY(-100px) rotate(0);opacity:1;}
  100%{transform:translateY(110vh) rotate(360deg);opacity:0;}
}

/* 信封 */
.envelope{
  width:500px;
  height:320px;
  background:#f8b6c8;
  border-radius:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* 按钮 */
button{
  padding:16px 32px;
  border:none;
  border-radius:50px;
  background:#ff4f87;
  color:white;
  font-size:20px;
  cursor:pointer;
  z-index:10;
}

/* 信 */
.letter{
  position:absolute;
  width:420px;
  background:white;
  border-radius:20px;
  padding:30px;
  top:60px;
  opacity:0;
  transition:1s;
  text-align:center;
  line-height:1.8;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

/* 打开效果 */
.open .letter{
  top:-260px;
  opacity:1;
}

/* 玫瑰 */
.rose{
  position:absolute;
  font-size:60px;
}
.left{left:60px;bottom:60px;}
.right{right:60px;bottom:60px;}
</style>
</head>

<body>

<!-- 玫瑰 -->
<div class="rose left">🌹🌹🌹</div>
<div class="rose right">🌹🌹🌹</div>

<!-- 信封 -->
<div class="envelope" id="box">
  <button onclick="openLetter()">点击打开 💌</button>

  <div class="letter">
    <h1 style="color:#ff4f87">母亲节快乐 ❤️</h1>
    <p>
      妈妈，谢谢您一直以来的爱与付出。<br><br>
      您是我最温暖的依靠，也是我最敬爱的人。<br><br>
      今晚让我为您做一顿晚饭 🍽️💕<br>
      希望您能开心、轻松、幸福。<br><br>
      永远爱您 ❤️
    </p>
  </div>
</div>

<script>
function openLetter(){
  document.getElementById("box").classList.toggle("open");
}

/* 花瓣生成 */
for(let i=0;i<25;i++){
  let p=document.createElement("div");
  p.className="petal";
  p.innerHTML="🌸";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(4+Math.random()*5)+"s";
  p.style.animationDelay=Math.random()*5+"s";
  document.body.appendChild(p);
}
</script>

</body>
</html>
